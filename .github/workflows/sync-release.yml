name: Sync, validate and release

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pstack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate snapshot
        run: |
          python scripts/build.py
          python scripts/validate.py

  sync-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Mirror upstream source without executing it
        run: python scripts/sync.py
      - name: Build, test and validate
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py
          python scripts/validate.py
      - name: Commit changed mirror and plugin
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add upstream upstream-lock.json plugin
          if ! git diff --cached --quiet; then
            git commit -m "$(python -c 'import json; d=json.load(open("upstream-lock.json")); print("sync: pstack " + d["version"] + " at " + d["commit"][:12])')"
            git push origin HEAD:main
          fi
      - name: Publish immutable ZIP only when payload changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(python -c 'import json; print(json.load(open("dist/release.json"))["tag"])')
          archive=$(python -c 'import json; print(json.load(open("dist/release.json"))["archive"])')
          if ! gh release list --limit 1000 --json tagName --jq '.[].tagName' | python -c 'import sys; sys.exit(0 if sys.argv[1] in sys.stdin.read().splitlines() else 1)' "$tag"; then
            gh release create "$tag" "dist/$archive" dist/SHA256SUMS \
              --target "$(git rev-parse HEAD)" --title "pstack-qoder $tag" \
              --notes-file dist/release-notes.txt --latest
          fi
